name: CI

# OPS-001 / C10 — build & test gate ყველა push-სა და PR-ზე.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Server ──
      - name: Install server deps
        run: npm ci

      - name: Server smoke check (require server.js parses & loads)
        env:
          # მინიმალური env, რომ fail-fast guard-მა გაიაროს; DB-ს რეალურად არ უკავშირდება.
          JWT_SECRET: ci-only-secret-not-used-in-production-32chars
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          NODE_ENV: test
        run: node --check server.js

      - name: Run server tests
        run: npm test --if-present

      # ── Client ──
      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Build client
        env:
          CI: false           # ESLint warnings არ ჩააგდებს build-ს
          GENERATE_SOURCEMAP: false
        run: npm run build
        working-directory: client

      - name: Run client tests
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests
        working-directory: client
